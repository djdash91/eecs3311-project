spring.application.name=accessfix
server.port=8080

# ---- Storage ----
# h2:     audits are saved in ./data and survive restarts and separate CLI commands (the default)
# memory: audits disappear when the app stops
accessfix.storage=h2
spring.datasource.url=jdbc:h2:file:./data/accessfix
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---- AI model ----
# gemini: Google AI Studio (GeminiLLMClient). The key comes from the GEMINI_API_KEY environment variable.
# claude: Anthropic (ClaudeLLMClient). The key comes from the ANTHROPIC_API_KEY environment variable.
# API keys are NOT set here: this file is committed.
accessfix.llm=gemini
accessfix.gemini.model=gemini-3.5-flash-lite
accessfix.gemini.max-tokens=16000

# Used when accessfix.llm=claude
accessfix.anthropic.model=claude-opus-5-5
accessfix.anthropic.max-tokens=16000

# ---- Agent limits (enforced in code, Stage 1 section 1.1) ----
accessfix.agent.retry-limit=2

# ---- Page loading ----
accessfix.snapshot.timeout-ms=30000
