spring.application.name=accessfix
server.port=8080

# ---- Storage ----
# memory: audits disappear when the app stops (the starter default, until JdbcAuditRepository works)
# h2:     audits are saved in ./data and survive restarts and separate CLI commands
accessfix.storage=memory
spring.datasource.url=jdbc:h2:file:./data/accessfix
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---- Claude ----
# The API key is NOT set here. It comes from the ANTHROPIC_API_KEY environment variable.
accessfix.anthropic.model=claude-opus-5-5
accessfix.anthropic.max-tokens=4096

# ---- Agent limits (enforced in code, Stage 1 section 1.1) ----
accessfix.agent.retry-limit=2

# ---- Page loading ----
accessfix.snapshot.timeout-ms=30000
